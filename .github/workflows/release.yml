name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/version.sh "$GITHUB_REF_NAME"
      - run: scripts/check.sh

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build assets
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(scripts/version.sh)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz \
              --title "Tabrelay $VERSION" --notes-file dist/RELEASE_NOTES.md
          fi
